code: LAB-001
title: 혈액 감지 센서 모듈 개발
type: service
status: building
created: 2026-10-14
updated: 2026-10-19
tags: [hardware, esp32, sensor]
summary: >
  환자의 혈액을 감지하기 위한 목적으로, 짧은 거리의 붉은색을 감지하여
  비프음을 내는 센서형 모듈을 제작하기 위한 계획.

flow:
  - label: 전원 ON
    detail: 깨끗한 솜과 투명 밴드 위에 기기를 얹은 뒤 확장 보드의 스위치를 켬
  - label: 기준값 저장
    detail: 깨끗한 흰 솜을 여러 번 측정해 평균을 기준값으로 저장하고, 확인음을 한 번 울림
  - label: 측정
    detail: 센서의 흰색 LED가 켜진 상태로 R·G·B 값을 읽음 (기기가 덮어 생기는 그림자가 주변광을 줄여줌)
  - label: 기준 대비 판정
    detail: 흰 솜 기준보다 빨강 비율이 오르고 초록이 크게 줄었는가? (혈액은 초록을 강하게 흡수)
  - label: 부저 ON
    detail: 3회 연속 혈액으로 판정되면 확장 보드 내장 부저로 소리 출력

goals:
  - 솜 위 투명 밴드에 얹은 상태(센서–솜 5~10mm)에서 혈액이 스며드는 것을 안정적으로 감지
  - 선홍색부터 검붉은색, 시간이 지나 갈변한 혈액까지 다양한 혈액 색을 감지
  - 케이블 없이 배터리만으로 동작하는 휴대용 형태
  - 전원을 켜면 별도 조작 없이 바로 감지

milestones:
  - title: 요구사항 분석
    due: 2026-10-14
    done: true
  - title: 제품 제작 계획 스케치
    due: 2026-10-18
    done: true
  - title: 부품 구매
    done: false

sections:
  - heading: 부품
    beforeMilestones: true
    body: |
      **납땜이 필요 없는 구성입니다.** 모든 부품을 꽂기만 하면 연결돼요.
      솜·투명 밴드와 기기 고정은 병원 쪽에서 준비하므로, 이 목록은 **센서 모듈**에 필요한 것만 담았어요.

      ### XIAO Ver

      | 부품 | 모델 | 역할 | 가격 | 구매 |
      | --- | --- | --- | --- | --- |
      | 마이크로컨트롤러 | Seeed XIAO ESP32-C3 (Pre-Soldered) [102010633] | 센서 데이터 처리 | 10,780원<br>해외 · 약 1주 | [디바이스마트](https://www.devicemart.co.kr/goods/view?no=15781764) |
      | 확장 보드 | Seeeduino XIAO 확장보드 [103030356] | 배터리 커넥터·충전, 전원 스위치, 부저, Grove 포트 | 26,290원<br>국내 · 1~3일 | [디바이스마트](https://www.devicemart.co.kr/goods/view?no=13113589) |
      | 컬러 센서 | Grove - I2C Color Sensor V2 [101020341] | 흰색 LED로 비추고 반사광의 R·G·B 측정 | 15,070원<br>해외 · 약 2주 | [디바이스마트](https://www.devicemart.co.kr/goods/view?no=1342781) |
      | 배터리 | LiPo 3.7V 500mAh (JST PH 2.0mm 2핀) | 휴대용 전원 | 19,600원 | [다나와](https://prod.danawa.com/bridge/go_link_goods.php?cate_c1=860&cate_c2=13735&cate_c3=14885&cate_c4=0&cmpny_c=TH201&link_prod_c=9654437802&cate=11230088) |
      | **합계** | | | **71,740원**<br>배송비 제외 | |

      디바이스마트 가격은 VAT 포함 가격이에요. 디바이스마트는 준비기간이 가장 긴 상품에 맞춰 함께 보내서 **약 2주 뒤** 받게 돼요.
      배터리는 디바이스마트에 2.0mm 커넥터 제품이 없어서 다나와 상품으로 넣었어요.

      ### 아두이노 Ver

      | 부품 | 모델 | 역할 | 가격 | 구매 |
      | --- | --- | --- | --- | --- |
      | 마이크로컨트롤러 | 아두이노 우노 R3 USB-C 타입 호환 보드 | 센서 데이터 처리 | 11,380원 | [쿠팡](https://www.coupang.com/vp/products/7539807001?itemId=19817671099&vendorItemId=93893252793) |
      | 컬러 센서 | Grove - I2C Color Sensor V2 [101020341] | 흰색 LED로 비추고 반사광의 R·G·B 측정 | 15,070원<br>해외 · 약 2주 | [디바이스마트](https://www.devicemart.co.kr/goods/view?no=1342781) |
      | 변환 케이블 | Grove - 4 pin Male Jumper to Grove 4 pin Conversion Cable (5개입) [110990210] | Grove 센서·부저를 우노 핀에 연결 | 3,200원 | [디바이스마트](https://m.devicemart.co.kr/goods/view/1153480) |
      | 부저 | 능동 부저 모듈 Grove Type | 혈액 감지 시 소리 출력 | 1,800원 | [쿠팡](https://www.coupang.com/vp/products/8151070394?itemId=23197208849&vendorItemId=90229804125) |
      | 전원 | 미니 보조배터리 (소전류 모드 지원) | 휴대용 전원, 전원 ON/OFF | 미정 | 쿠팡 |
      | **합계** | | | **31,450원**<br>보조배터리·배송비 제외 | |

      우노에는 확장 보드가 없어서 부저와 전원을 따로 붙여요. 전원은 보조배터리를 USB로 연결하고, 보조배터리 버튼으로 켜고 꺼요.
      변환 케이블이 5개 들어 있어서 센서와 부저를 모두 같은 케이블로 연결할 수 있어요.

      가격은 각 사이트에 표시된 가격입니다(디바이스마트·쿠팡 2026.10.19, 배터리(다나와) 2026.10.18 기준). 판매처 사정에 따라 바뀔 수 있어요.

      ### 구매 시 확인할 점

      - **XIAO ESP32C3** — 헤더가 납땜된 버전이어야 확장 보드에 꽂을 수 있어요. 상품명이 번역체라 구매 전 옵션에서 *사전 납땜(Pre-Soldered)* 을 꼭 확인하세요. 외장 안테나 포함 여부도 같이 확인하세요.
      - **확장 보드** — 배터리 커넥터, 충전 회로, 전원 스위치, 부저(A3 핀)가 모두 들어 있어서 부저·스위치를 따로 살 필요가 없어요.
      - **컬러 센서** — Grove 케이블이 보통 함께 들어 있어서 확장 보드의 I2C 포트에 바로 꽂으면 돼요. 구매 페이지에서 케이블 포함 여부를 확인하세요. 흰색 LED는 보드 위 스위치로 켜 두는 방식이에요.
      - **배터리** — JST 커넥터는 제조사마다 +/− 방향이 반대인 경우가 있어요. 꽂기 전에 배터리 선 색(빨강 +, 검정 −)이 확장 보드 커넥터의 극성과 맞는지 꼭 확인하세요.
      - **우노 (아두이노 Ver)** — USB-C 케이블은 포함되지 않을 수 있어요. 집에 있는 케이블을 쓰되, 충전 전용이 아닌 *데이터 전송* 이 되는 케이블이어야 코드를 올릴 수 있어요.
      - **변환 케이블 (아두이노 Ver)** — 끝이 수(Male) 핀인 제품이어야 우노에 바로 꽂혀요. 컬러 센서는 빨강 → 5V, 검정 → GND, 흰색 → A4(SDA), 노랑 → A5(SCL)에 꽂아요.
      - **부저 (아두이노 Ver)** — 우노의 5V 핀은 센서가 쓰므로 부저 빨간 선은 3.3V에, 노란 선은 D8 같은 디지털 핀에 꽂아요. 흰색 선은 쓰지 않아요.
      - **보조배터리 (아두이노 Ver)** — 아두이노는 전력을 적게 써서 일반 보조배터리는 몇십 초 뒤 저절로 꺼질 수 있어요. *소전류 모드* 를 지원하는 제품을 고르세요.
